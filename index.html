<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Tuppo - Artist Page</title>

    <!-- Connects the page to style.css -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="container">

        <!-- EP COVER -->
        <img
            src="Contours_cover.png"
            alt="Tuppo"
            class="cover"
        >


        <!-- EP TITLE -->
        <h1>Contours</h1>

        <p class="release">
            Debut EP · September 22, 2026
        </p>


        <!-- =========================
             LISTEN
             ========================= -->

        <section class="links-section">

            <h2>Listen</h2>

             <div class="icon-links">

                <!-- Spotify -->
                <a href="https://open.spotify.com/artist/17uor8niD53P5ee1AeXx27?si=H2NtXvFqQg2WRU-l-E6TZA"
                   target="_blank"
                   aria-label="Spotify">
                    <img src="https://cdn.simpleicons.org/spotify/ffffff" alt="Spotify">
                </a>

                <!-- Apple Music -->
                <a href="https://music.apple.com/us/artist/tuppo/1792706946"
                   target="_blank"
                   aria-label="Apple Music">
                    <img src="https://cdn.simpleicons.org/applemusic/ffffff" alt="Apple Music">
                </a>

                <!-- Tidal -->
                <a href="https://tidal.com/@tuppo"
                   target="_blank"
                   aria-label="Tidal">
                    <img src="https://cdn.simpleicons.org/tidal/ffffff" alt="Tidal">
                </a>

                <!-- Deezer -->
                <a href="https://link.deezer.com/s/34o4Zy21y69iYlDZXReNy"
                   target="_blank"
                   aria-label="Deezer">
                    <img src="https://cdn.simpleicons.org/deezer/ffffff" alt="Deezer">
                </a>

                <!-- Bandcamp -->
                <a href="https://tuppo.bandcamp.com/"
                   target="_blank"
                   aria-label="Bandcamp">
                    <img src="https://cdn.simpleicons.org/bandcamp/ffffff" alt="Bandcamp">
                </a>

            </div>

        </section>


        <!-- =========================
             SOCIAL
             ========================= -->

        <section class="links-section">

            <h2>Social</h2>

            <div class="icon-links">

                <!-- Instagram -->
                <a href="https://www.instagram.com/tuppo_/"
                   target="_blank"
                   aria-label="Instagram">
                    <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram">
                </a>

                <!-- Facebook -->
                <a href="https://www.facebook.com/tuppo.music"
                   target="_blank"
                   aria-label="Facebook">
                    <img src="https://cdn.simpleicons.org/facebook/ffffff" alt="Facebook">
                </a>
    
                <!-- YouTube -->
                <a href="https://www.youtube.com/@tuppo_"
                   target="_blank"
                   aria-label="YouTube">
                    <img src="https://cdn.simpleicons.org/youtube/ffffff" alt="YouTube">
                </a>

            </div>

        </section>


        <!-- =========================
             CONTACT
             ========================= -->

        <section class="contact"> 
            <h2>Contact</h2> 
            <a href="mailto:contact@tuppo.music">
                contact@tuppo.music 
            </a> 
        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>
        Tuppo, 2026
    </footer>

</body>
</html>
